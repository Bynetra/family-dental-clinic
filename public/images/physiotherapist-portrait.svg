<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F1"/>
      <stop offset="50%" stop-color="#DFEFEA"/>
      <stop offset="100%" stop-color="#CEE4DC"/>
    </linearGradient>
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F7F5"/>
    </linearGradient>
    <linearGradient id="scrubs-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#145A53"/>
      <stop offset="100%" stop-color="#0E423D"/>
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2B193"/>
      <stop offset="100%" stop-color="#D19C7C"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A332E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="720" fill="url(#bg-grad)"/>

  <!-- Subtle Medical Ambient Circles & Patterns -->
  <circle cx="300" cy="300" r="220" fill="#9DBBA6" opacity="0.25"/>
  <circle cx="300" cy="300" r="180" fill="#FFFFFF" opacity="0.4"/>

  <!-- Decorative Medical Cross Watermark -->
  <g opacity="0.12" fill="#0E4F4A">
    <rect x="275" y="60" width="50" height="15" rx="7"/>
    <rect x="292.5" y="42.5" width="15" height="50" rx="7"/>
  </g>

  <!-- Doctor Figure Container with soft shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Shoulders & Upper Body Base (Scrubs) -->
    <path d="M140 720 C140 550 190 440 300 440 C410 440 460 550 460 720 Z" fill="url(#scrubs-grad)"/>

    <!-- V-Neck Inner Shirt -->
    <path d="M260 440 L300 515 L340 440 Z" fill="#0A332E"/>

    <!-- Doctor White Lab Coat (Left & Right Flaps) -->
    <path d="M140 720 C140 560 185 450 250 440 L285 570 L260 720 Z" fill="url(#coat-grad)"/>
    <path d="M460 720 C460 560 415 450 350 440 L315 570 L340 720 Z" fill="url(#coat-grad)"/>

    <!-- Coat Lapels -->
    <path d="M250 440 L285 550 L245 520 L220 460 Z" fill="#E8F1ED"/>
    <path d="M350 440 L315 550 L355 520 L380 460 Z" fill="#E8F1ED"/>

    <!-- ID Badge on Chest -->
    <rect x="360" y="580" width="45" height="60" rx="6" fill="#FFFFFF" stroke="#D0E3DC" stroke-width="2"/>
    <rect x="368" y="590" width="29" height="20" rx="3" fill="#DFEFEA"/>
    <line x1="368" y1="620" x2="395" y2="620" stroke="#0E4F4A" stroke-width="3" stroke-linecap="round"/>
    <line x1="368" y1="628" x2="388" y2="628" stroke="#9DBBA6" stroke-width="2" stroke-linecap="round"/>
    <rect x="377" y="572" width="11" height="8" rx="2" fill="#0E4F4A"/>

    <!-- Stethoscope -->
    <!-- Tubing around neck -->
    <path d="M230 450 C230 540 265 600 280 610" stroke="#1A2D2A" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M370 450 C370 540 335 600 320 610" stroke="#1A2D2A" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Y-connector & lower tube -->
    <path d="M300 610 L300 640" stroke="#1A2D2A" stroke-width="10" stroke-linecap="round"/>
    <!-- Chestpiece (Bell/Diaphragm) -->
    <circle cx="300" cy="655" r="18" fill="#CFDCD8" stroke="#1A2D2A" stroke-width="6"/>
    <circle cx="300" cy="655" r="8" fill="#1A2D2A"/>

    <!-- Neck -->
    <rect x="270" y="340" width="60" height="90" rx="25" fill="url(#skin-grad)"/>

    <!-- Head & Face Silhouette -->
    <ellipse cx="300" cy="270" rx="85" ry="98" fill="url(#skin-grad)"/>

    <!-- Professional Hair Styling -->
    <path d="M215 260 C215 180 250 150 300 150 C350 150 385 180 385 260 C370 230 350 215 300 215 C250 215 230 230 215 260 Z" fill="#243431"/>
    <!-- Sideburns -->
    <path d="M215 250 L218 290 L226 290 L223 250 Z" fill="#243431"/>
    <path d="M385 250 L382 290 L374 290 L377 250 Z" fill="#243431"/>

    <!-- Ears -->
    <ellipse cx="215" cy="275" rx="12" ry="20" fill="url(#skin-grad)"/>
    <ellipse cx="385" cy="275" rx="12" ry="20" fill="url(#skin-grad)"/>

    <!-- Friendly Minimal Facial Accents -->
    <!-- Eyes -->
    <ellipse cx="265" cy="265" rx="6" ry="7" fill="#1D2A28"/>
    <ellipse cx="335" cy="265" rx="6" ry="7" fill="#1D2A28"/>
    <circle cx="267" cy="263" r="2" fill="#FFFFFF"/>
    <circle cx="337" cy="263" r="2" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M250 250 Q265 244 280 250" stroke="#243431" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M320 250 Q335 244 350 250" stroke="#243431" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Gentle Smile -->
    <path d="M280 315 Q300 330 320 315" stroke="#9A594A" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bottom Badge: Consultant Physiotherapist -->
  <g transform="translate(160, 665)">
    <rect width="280" height="38" rx="19" fill="#0E4F4A" opacity="0.95"/>
    <text x="140" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.5">
      CONSULTANT PHYSIOTHERAPIST
    </text>
  </g>
</svg>
